# Not run remotely yet (no remote configured). Security gates per tech-stack.md §3.
# Planned repo: github.com/shagunlabs/sentryra (placeholder org, to be confirmed). No remote configured.
name: ci
on: [push, pull_request]
env: { GITHUB_ORG: shagunlabs }  # placeholder
permissions: { contents: read }
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (2026-10-14)
        with: { toolchain: stable, components: "rustfmt, clippy" }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc  # noamx shim build (deploy/noamx/build.sh)
      - run: make noamx  # builds + sha256-checks the shim used by edge t2_amx tests
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (2026-10-14)
        with: { toolchain: stable }
      - run: cargo install --locked cargo-deny cargo-audit
      - run: cargo deny check
      - run: cargo audit
      - name: secret scan (pinned gitleaks CLI, full history, no licence needed)
        env: { GITLEAKS_VERSION: "8.30.1", GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" }
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --exit-code 1 .
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform -chdir=deploy/terraform fmt -check -recursive
      - run: terraform -chdir=deploy/terraform init -backend=false && terraform -chdir=deploy/terraform validate
